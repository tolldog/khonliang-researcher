[project]
name = "khonliang-researcher"
version = "0.3.0"
description = "Research paper ingestion and distillation pipeline powered by khonliang"
requires-python = ">=3.11"
dependencies = [
    "ollama-khonliang @ git+https://github.com/tolldog/ollama-khonliang.git@main",
    "khonliang-researcher-lib @ git+https://github.com/tolldog/khonliang-researcher-lib.git@f861055624467b534ded1b086a5ec1e5561f3d83",
    "aiohttp>=3.9",
    "Brotli>=1.1.0",  # aiohttp decodes `br` content-encoding only when this is
                      # importable; undeclared-transitive in dev, absent in prod
                      # → brotli blogs failed (bug_khonliang-researcher_e5ad3234)
    "beautifulsoup4>=4.12",
    "click>=8.0",
    "psutil>=5.9",  # cross-platform process start-time for distill-lock owner
                    # tokens on hosts without /proc (bug abfe679b)
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "markdownify>=0.12",
    "mcp>=1.0.0",
    "khonliang-bus-lib>=0.5.0",  # >=0.5.0 for Welcome / WelcomeEntryPoint exports
    "pydantic>=2.0",  # researcher/structure.py targets caller-supplied
                      # Pydantic schemas directly (fr_researcher_d813ad52);
                      # was previously only a transitive dep via mcp/bus-lib.
]

# khonliang-librarian-lib (SelfCatalog knowledge-owner contract,
# fr_researcher_bbe95f12) is deliberately an OPTIONAL extra, not a hard
# dependency: unlike every entry above, researcher/self_catalog.py imports
# it defensively (try/except ImportError) and degrades to "catalog
# disabled" when it's absent. Putting it in `dependencies` instead would
# defeat that: pip's dependency resolution fails before Python ever runs,
# so the graceful-degradation code would never get a chance to execute —
# and it's a bare-name local-editable dependency (no PyPI package, same as
# khonliang-bus-lib above), so a bare `pip install .` in a fresh checkout
# without the sibling repo present would then hard-fail installation
# entirely instead of just running with self-cataloging turned off.
# Enable it with `pip install -e ".[catalog]"` (after `pip install -e
# ../khonliang-librarian-lib`, same sibling-checkout convention every
# other khonliang-* dependency in this file already uses).
[project.optional-dependencies]
catalog = ["khonliang-librarian-lib>=0.1.0"]

[project.scripts]
khonliang-researcher = "researcher.cli:main"

[tool.setuptools.packages.find]
include = ["researcher*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
