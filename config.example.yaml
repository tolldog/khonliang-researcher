# khonliang-researcher config — example template
#
# Copy this file to config.yaml and edit the paths and project entries
# for your environment. The actual config.yaml is git-ignored because
# it contains absolute, machine-specific paths and may reference private
# projects that should not be checked in.

models:
  summarizer: qwen2.5:7b
  extractor: llama3.2:3b
  assessor: qwen2.5:7b
  idea_parser: llama3.2:3b
  embedder: nomic-embed-text
  reviewer: qwen2.5:32b

model_timeouts:
  llama3.2:3b: 120
  qwen2.5:7b: 120
  qwen2.5:32b: 600
  gemma4:31b: 600
  deepseek-r1:32b: 600

relevance_threshold: 0.6

# Certainty scaling for triples extracted from ideas / blogs vs papers.
# Blogs and informal notes are lower-confidence sources than peer-reviewed
# papers, so their extracted triples enter the concept graph with confidence
# multiplied by this factor (papers keep their full extractor confidence).
# Range [0, 1]; default 0.6. Lower → blogs influence the graph less.
idea_confidence_factor: 0.6

synergize_samples: 3

ollama_url: http://localhost:11434

predicate_aliases:
  applicable_to: applies_to
  used_for: uses_method
  achieves: outperforms
  extends: improves_on
  based_on: uses_method
  related: related_to
  utilizes: uses_method
  employs: uses_method

feeds_opml: feeds.opml

# Resilient URL ingestion. When a direct fetch is blocked (403/429/503, or any
# 4xx/5xx from a known anti-bot host like Substack), fetch_url can retry through
# a readability/reader proxy. OFF by default (fail-closed: no external calls
# unless configured). `proxy` must contain the `{url}` placeholder; `hosts` is
# an optional allowlist (suffix match) so arbitrary URLs aren't shipped to the
# proxy — omit/empty to apply to any blocked host.
# fetcher:
#   readability_fallback:
#     proxy: "https://r.jina.ai/{url}"
#     hosts: ["substack.com", "medium.com"]

# Embedded distillation worker. The agent runs a background loop that drains
# the ingest queue (distills INGESTED entries) and idle-polls when empty, so
# ingesting content does not require a manual start_distillation call.
# Set embedded: false ONLY if you run the standalone
# `python -m researcher.worker` against the same DB, to avoid two drainers
# racing on the same entries.
distill_worker:
  embedded: true
  pause_between: 2.0   # seconds between entries
  idle_poll: 30        # seconds to sleep when the queue is empty

# Async ingest jobs (ingest_*_async / distill_paper_async). Two independent
# bounds: ingest_async_concurrency caps how many jobs RUN at once (others park
# at phase=accepted); ingest_max_inflight caps how many accepted-but-unfinished
# jobs may exist at all — a spawn beyond it is rejected synchronously with a
# retryable error rather than queuing an unbounded backlog of parked tasks.
ingest_async_concurrency: 4
ingest_max_inflight: 128

db_path: data/researcher.db

# Optional: bus agent id stamped as the SelfCatalog's owner_agent descriptor
# (fr_researcher_bbe95f12). Defaults to "researcher-primary" when unset —
# only needs overriding if this instance registers under a different bus
# agent_id. The catalog sidecar itself (self_catalog.db, next to db_path)
# is always enabled once db_path is set; there is no separate on/off flag.
# bus_agent_id: researcher-primary

# Domain rules — optional. When set, these rules are appended to the
# summarizer, extractor, and assessor system prompts so the distillation
# LLMs evaluate papers through a domain-specific lens. Leave unset for
# generic researcher behavior.
#
# Each domain instance runs the same code against the same base prompts;
# only the rules differ. Run multiple instances with different configs
# (and different db_paths) to scope a corpus to a domain.
#
# domain:
#   name: developer
#   rules:
#     - "Prioritize papers that describe concrete engineering practices over theoretical surveys."
#     - "Score multi-agent orchestration frameworks by whether they cleanly separate routing from execution."
#     - "Penalize papers whose only contribution is a benchmark without a reusable mechanism."

# Projects this researcher instance scores papers against. Edit the
# `repo` accepts either a local checkout path or a GitHub repository URL.
# GitHub URLs are the default for portable agent/runtime configuration;
# local paths are still useful for active development.
projects:
  khonliang:
    description: >
      Multi-agent LLM orchestration library with roles, routing, consensus,
      knowledge stores, triple stores, digest synthesis, and MCP server.
    scope: library
    depends_on: []
    repo: https://github.com/tolldog/ollama-khonliang
  genealogy:
    description: >
      Family history research tool using khonliang. Multi-agent system with
      researcher, fact-checker, narrator roles. GEDCOM parsing, cross-tree
      entity resolution, knowledge graph for family relationships, agentic
      RAG for historical records, WebSocket chat with session context.
    scope: genealogy
    depends_on: [khonliang]
    repo: https://github.com/tolldog/genealogy
  researcher-lib:
    description: >
      Shared research/evaluation primitives library. Provides RelevanceScorer,
      entity graph, BaseSynthesizer, BaseQueueWorker, BaseIdeaParser,
      select_best_of_n, and LocalDocReader. Used by both researcher (ingest
      world) and developer (create artifacts) apps.
    scope: library
    depends_on: [khonliang]
    repo: https://github.com/tolldog/khonliang-researcher-lib
  khonliang-bus:
    description: >
      Cross-app event bus and service registry. Go server with Python+Go
      clients, HTTP+WebSocket transport, durable subscriptions, pluggable
      backends. Optional infrastructure that any app can register with for
      push notifications and service discovery.
    scope: infrastructure
    depends_on: [khonliang]
    repo: https://github.com/tolldog/khonliang-bus
  researcher:
    description: >
      Automated research pipeline: RSS/search -> fetch -> distill ->
      concept graph -> concept bundles and evidence briefs. MCP server for
      developer and project agents to consume research insights. Researcher
      does not own active FR lifecycle state.
    scope: research
    depends_on: [khonliang, researcher-lib]
    repo: https://github.com/tolldog/khonliang-researcher
  developer:
    description: >
      Development lifecycle MCP server. Inverse of researcher: ingests
      specs/milestones/FRs, evaluates them against the research corpus
      using local LLM best-of-N, manages git worktrees per FR, bundles
      related FRs into work units, and dispatches pre-evaluated work
      packages to Claude with full evidence chains. Talks to researcher
      via khonliang-bus for on-demand corpus operations. Lets Claude
      focus purely on code and code review.
    scope: development
    depends_on: [khonliang, researcher-lib, khonliang-bus]
    repo: https://github.com/tolldog/khonliang-developer
